[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-rrc-adjudicated"
version = "1.0.0"
description = "Rhetorical role classification of Arabic court judgments with adjudicated multi-role and nested span annotations"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Sarah Kohail" }]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "transformers>=4.34",
]

[project.optional-dependencies]
crf = ["sklearn-crfsuite>=0.3"]
grid3 = ["stanza>=1.11"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["rrc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
